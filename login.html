<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gym Management System | Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body data-page="login">
  <div class="login-shell">
    <div class="login-card">
      <div class="brand">
        <img class="brand-logo" src="assets/images/st_jym_logo.png" alt="ST JYM logo" />
        <div>
          <div class="brand-title">ST JYM</div>
          <div class="brand-subtitle">Admin Access</div>
        </div>
      </div>
      <h1 class="page-title">Sign in</h1>
      <p class="page-subtitle">Use your admin credentials to manage the gym system.</p>

      <form id="loginForm" class="mt-4">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" id="loginUsername" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <!-- <div class="login-hint">Demo admin: <strong>admin</strong> / <strong>admin123</strong></div> -->
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
